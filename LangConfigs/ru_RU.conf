L_CLEAR_SYS_CACHE_DESC='Очищает системный кэш времени выполнения, необходимый для работы. Подходит при появлении странных ошибок в системе или после крупных изменений. После очистки система автоматически перестроит этот кэш. Эта операция не повышает производительность и не снижает эффективно использование хранилища. Если вы не разбираетесь, не рекомендуется использовать без необходимости. После очистки рекомендуется перезагрузить устройство.'
